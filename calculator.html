<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: baseline;
            padding-top: 20px;
        }
        .body{
            height: max-content;
            width: max-content; 
            display: flex;
            flex-flow: column;
            border: 20px solid aquamarine;
            border-radius: 20px;
            border-top-color: rgb(137, 250, 212);
            border-left-color: rgb(89, 158, 135);
            border-right-color: rgb(90, 182, 151);
            border-bottom-color: rgb(69, 158, 128);
            box-shadow: 10px 10px 20px black;
        }
        .screen{
            background-color: black;
            height: 200px;
            width: 350px;
            display: flex;
            flex-flow: column;
            align-items: flex-end;
            justify-content: flex-end;
        }
        #expression{
            background-color: black;
            color: rgb(218, 216, 216);
            padding-right: 10px;
            font-size: 1.2rem;
            font-weight: 400;
        }
        #expression{
            background-color: black;
            color: rgb(218, 216, 216);
            padding-right: 10px;
            font-size: 1.2rem;
            font-weight: 400;
        }
        #results{
            background-color: black;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            padding: 10px;
        }
        .keyboard{
            background-color: aquamarine;
            padding: 0;
            width: 350px;
            height: 350px;
            display: grid;
            grid-template-columns: repeat(4,80px);
            gap: 10px;

        }
        button{
            font-weight: 700;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 1.5rem;

        }
        button{
            border-bottom: 12px solid rgb(156, 156, 156);
            border-top: 10px solid rgb(78, 77, 77);
            border-right: 10px solid rgb(97, 96, 96);
            border-left: 10px solid rgb(102, 100, 100);
            background-color: aquamarine;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.637);
            transition: all 0.3s ease-in-out;

        }
        button:active{
            box-shadow: none;
            transform: scale(0.9);
        }
    </style>
    <div class="body">
        <div class="screen">
            <div id="expression">12+35+78</div>
            <div id="results">125</div>
        </div>
        <div class="keyboard">
            <button>C</button>
            <button>CE</button>
            <button>%</button>
            <button>/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>X</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>00</button
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div>


    <script type="text/javascript" charset="utf-8">
        const buttons = document.querySelectorAll("button");
        const expression= document.getElementById("expression");
        const results = document.getElementById("results");

        //expression.innerHTML="";
        //results.innerHTML="";

        buttons.forEach(button => {button.addEventListener("click", function(){
            
            let value = button.textContent;

            if (value === "CE"){
                expression.textContent="";
                results.textContent="";
                console.log(value);}
            
            else if (value === "C"){
                expression.textContent= expression.textContent.slice(0, -1);
                console.log("deleted")

            }
            else if (Number.isFinite(Number(value))){
                expression.textContent += value;
            }
            else if (value= "+"){

                const contentOne= expression.textContent;
                expression.textContent="";
                console.log(contentOne)

            }

        })    
    })

    </script>
</body>
</html>
