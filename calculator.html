<html lang="en">
<head>

    <style>
        body{
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: baseline;
            padding-top: 20px;
        }
        .body{
            height: max-content;
            width: max-content; 
            display: flex;
            flex-flow: column;
            border: 20px solid aquamarine;
            border-radius: 20px;
            border-top-color: rgb(137, 250, 212);
            border-left-color: rgb(89, 158, 135);
            border-right-color: rgb(90, 182, 151);
            border-bottom-color: rgb(69, 158, 128);
            box-shadow: 10px 10px 20px black;
        }
        .screen{
            background-color: black;
            height: 200px;
            width: 350px;
            display: flex;
            flex-flow: column;
            align-items: flex-end;
            justify-content: flex-end;
        }
        #aftersign{
            background-color: black;
            color: rgb(218, 216, 216);
            padding-right: 10px;
            font-size: 1.2rem;
            font-weight: 400;
        }
        #expression{
            background-color: black;
            color: rgb(218, 216, 216);
            padding-right: 10px;
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        #view{
            background-color: black;
            color: rgb(218, 216, 216);
            padding-right: 10px;
            font-size: 1.4rem;
            font-weight: 600;
        }
        #results{
            background-color: black;
            color: white;
            font-weight: 700;
            font-size: 1.6rem;
            padding: 10px;
        }
        .keyboard{
            background-color: aquamarine;
            padding: 0;
            width: 350px;
            height: 350px;
            display: grid;
            grid-template-columns: repeat(4,80px);
            gap: 10px;

        }
        button{
            font-weight: 700;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 1.5rem;

        }
        button{
            border-bottom: 12px solid rgb(156, 156, 156);
            border-top: 10px solid rgb(78, 77, 77);
            border-right: 10px solid rgb(97, 96, 96);
            border-left: 10px solid rgb(102, 100, 100);
            background-color: aquamarine;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.637);
            transition: all 0.3s ease-in-out;

        }
        button:active{
            box-shadow: none;
            transform: scale(0.9);
        }
    </style>

        <div class="screen">

            <div id="aftersign"></div>
            <div id="expression">0</div>
            <div id="results"></div>

            <button>9</button>
            <button>X</button>
            <button>4</button>

            <button>3</button>

            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>

        const buttons = document.querySelectorAll("button");
        const expression= document.getElementById("expression");
        const aftersign= document.getElementById("aftersign");
        const results = document.getElementById("results");
        const viewDetail = document.getElementById("view")
        let calcResult = 0;
        let contentOne = Number(expression.textContent);
        let operator = "";
        let finalresult = 0;

        buttons.forEach(button => {button.addEventListener("click", function(){
            
            let value = button.textContent;

            if (value === "CE"){
                expression.textContent=0;
                results.textContent="";
                aftersign.textContent=""
                calcResult = 0
                console.log(value);
                viewDetail.textContent= ""
            }
            
            else if (value === "C"){
                expression.textContent= expression.textContent.slice(0, -1);
                console.log("deleted")

            }
            else if (Number.isFinite(Number(value))){
                    if (finalresult>0){ 
                    aftersign.textContent="";  
                    viewDetail.textContent= "";
                    expression.textContent += value;
                    contentOne=Number(expression.textContent);
                }
                else {
                    expression.textContent += value;
                    contentOne=Number(expression.textContent);
                }
            }
            else if (value=== "+"){
                operator=value;
                calcResult += contentOne;
                expression.textContent="";
                console.log(calcResult);
                aftersign.textContent=calcResult;
                contentOne = 0;
            }
            else if (value === "-"){
                operator=value;
                if (calcResult === 0 || aftersign.textContent===""){
                    expression.textContent="";
                    calcResult=contentOne;
                    console.log(calcResult);
                    aftersign.textContent=calcResult;

                }
                else {
                    calcResult -= contentOne;
                    expression.textContent="";
                    console.log(calcResult);
                    aftersign.textContent=calcResult;}    
            }
            else if (value === "X"){
                operator=value;
                if (calcResult === 0){
                    calcResult = 1;
                    let product = calcResult * contentOne;
                    expression.textContent="";
                    calcResult = product;
                    console.log(calcResult);
                    aftersign.textContent=calcResult;
                }
                else if (calcResult > 0 && contentOne === 0){
                    expression.textContent="";
                    console.log(calcResult);
                    aftersign.textContent=calcResult;

                }
                else {
                    calcResult *= contentOne;
                    expression.textContent="";
                    console.log(calcResult);
                    aftersign.textContent=calcResult;

                }

            }
            else if (value === "."){
                if (expression.textContent.includes(value)){
                    expression.textContent+="";
                } 
                else if (expression.textContent==0){
                    expression.textContent="0." ;
                }
                else{expression.textContent += value;}
            }
            else if (value === "/"){
                operator=value;
                if (calcResult === 0){

                    calcResult = contentOne;
                    console.log(calcResult);
                    aftersign.textContent=calcResult;
                    expression.textContent="";
                }
                else if (calcResult > 0 && contentOne === 0){
                    expression.textContent="";
                    console.log(calcResult);
                    aftersign.textContent=calcResult;
                }
                else {
                    let division = calcResult/ contentOne;
                    calcResult = division;
                    console.log(calcResult);
                    aftersign.textContent=calcResult; 
                }   
            }
            else if (value === "%"){
                operator=value;
                calcResult= contentOne / 100 ;
                console.log(calcResult);
                aftersign.textContent=calcResult;    
            }

            else if(value === "="){

                if (operator === "+"){
                    finalresult=calcResult+contentOne;
                    expression.textContent="";
                }
                else if (operator === "-"){
                    finalresult=calcResult-contentOne;
                    expression.textContent="";
                }
                else if (operator === "X"){
                    finalresult=calcResult*contentOne;
                    expression.textContent="";
                }
                else if (operator === "/"){
                    finalresult=calcResult/contentOne;
                    expression.textContent="";
                }

                results.textContent = finalresult;
                viewDetail.textContent= calcResult+" "+operator+" "+contentOne;
                calcResult = finalresult;
                aftersign.textContent=calcResult;
                contentOne = 0;
                console.log(calcResult,contentOne);

            }

        });
        
         
    })

</html>
